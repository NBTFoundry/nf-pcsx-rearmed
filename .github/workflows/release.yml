# SPDX-License-Identifier: GPL-2.0-or-later
# Signed package from a vMAJOR.MINOR.PATCH tag: NBT Manager's application release
# workflow builds it in the private QNX image, signs it with the apps key (this
# repository's "release" environment, secret APPS_SIGNING_KEY, after approval) and
# publishes pcsx-X.Y.Z.nbt. The executable is the SDK's nbt-runner (built with the
# image's QNX 6.5 SP1 SDP) with the guest appended (built with the NBT toolchain
# release the SDK pins): PCSX ReARMed is GPL and never links QNX code. The tag gives
# the version and the sequence; release/package.args describes the package;
# release/sdk.ref names the NBTFoundry/sdk commit it builds against (ci.yml reads the
# same file).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  pins:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sdk: ${{ steps.read.outputs.sdk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: release/sdk.ref
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: read
        run: |
          sdk="$(cat release/sdk.ref)"
          [[ "$sdk" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release/sdk.ref is not a commit"; exit 1; }
          echo "sdk=$sdk" >>"$GITHUB_OUTPUT"

  release:
    needs: pins
    uses: NBTFoundry/manager/.github/workflows/app-release.yml@324cf43cf486753e282e33d5d8625942245b7176 # manager main
    permissions:
      contents: write
      packages: read
    # The apps key is an environment secret; a called workflow sees it only so.
    secrets: inherit
    with:
      sdk-ref: ${{ needs.pins.outputs.sdk }}
      build: make -C ../sdk toolchain && make -j"$(nproc)" guest-bundle
      payload: build/nbt-pcsx-bundle
